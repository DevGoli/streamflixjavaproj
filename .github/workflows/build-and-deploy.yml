name: Build and Deploy Java Application to AWS Elastic Beanstalk

on:
    workflow_dispatch

permissions:
    contents: read
    id-token: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v3
            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                    distribution: 'temurin'
                    java-version: '21'
                    cache: 'maven'
            - name: Java and Maven version
              run: |
                java --version
                mvn --version

            - name: Build with Maven
              run: mvn clean package

            - name: Verify Jar
              run: |
                ls -l target/*.jar
                echo "Build and deploy workflow completed successfully."

            - name: Prepare ebs package
              run: |
                mkdir -p eb-deployment
                cp target/*.jar eb-deployment/application.jar
                echo "web: java -jar application.jar" > eb-deployment/Procfile
                ls -la eb-deployment

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                    name: streamflix-deployment
                    path: eb-deployment

    Terraform:
        name: Terraform infra 
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Checkout
              uses: actions/checkout@v3

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                aws-region: ap-southeast-2
                role-session-name: GitHubActionsAWSConnection
            - name: Test AWS OIDC Authentication
              run: |
                    aws sts get-caller-identity

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
            
            - name: Terraform Init
              working-directory: terraform
              run: terraform init

            - name: Terraform Validate
              working-directory: terraform
              run: terraform validate

            - name: Terraform Plan
              working-directory: terraform
              run: terraform plan

            - name: Terraform Apply
              working-directory: terraform
              run: terraform apply -auto-approve


    Deploy:
        name: Deploy to AWS EBS
        runs-on: ubuntu-latest
        needs: Terraform
        steps:
            - name: Download artifact
              uses: actions/download-artifact@v4
              with:
                    name: streamflix-deployment
                    path: deployment
            - name: Verify deployment files
              run: |
                echo "Verifying deployment files..."
                ls -la deployment
                echo "Proc file content:"
                cat deployment/Procfile
                test -f deployment/*.jar && echo "application.jar exists."
                test -f deployment/Procfile && echo "Procfile exists."
            
            - name: Create deployment zip file
              run: |
                cd deployment
                zip -r ../streamflixdeployment.zip .
                cd ..
                echo "Deployment zip file created."
                unzip -l streamflixdeployment.zip

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                    role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                    aws-region: ap-southeast-2
                    role-session-name: GitHubActionsAWSConnection

            - name: Test OIDC Authentication
              run: |
                    aws sts get-caller-identity
            
            - name: Deploy to AWS Elastic Beanstalk
              uses: aws-actions/aws-elasticbeanstalk-deploy@v1
              with:
                    application-name: streamflix
                    environment-name: streamflix-dev
                    version-label: streamflix-${{ github.run_id }}
                    aws-region: ap-southeast-2
                    deployment-package-path: streamflixdeployment.zip
